<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AcrillService</title>

    <script>
        function obterTemaCookie() {
            const cookie = document.cookie.split('; ').find(row => row.startsWith('app_theme='));
            return cookie ? cookie.split('=')[1] : 'light';
        }

        const savedTheme = obterTemaCookie();
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./assets/css/login.css">
</head>
<body>

<button type="button" id="theme-toggle" class="btn-theme-floating" title="Alternar Tema" aria-label="Alternar Tema">
    <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
</button>

<main class="login-wrapper">
    <div class="form-card">
        <div class="form-card-inner">
            <div class="brand-header">
                <img src="./assets/images/acrillogo.svg" alt="Logo AcrillService" class="brand-logo">
            </div>

            <h1 class="login-title">ENTRAR</h1>
            <p class="login-subtitle">Insira as credenciais para continuar</p>
            <hr class="login-divider">

            <div class="alert" id="alert-card" role="alert">
                <i class="bi bi-exclamation-triangle-fill alert-icon"></i>
                <span id="alert-text">alerta mensagem</span>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">E-MAIL</label>
                    <div class="input-wrapper">
                        <i class="bi bi-envelope-fill input-icon"></i>
                        <input type="email" id="email" placeholder="usuario@empresa.com" autocomplete="username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">SENHA</label>
                    <div class="input-wrapper">
                        <i class="bi bi-lock-fill input-icon"></i>
                        <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required>
                        <button type="button" id="toggle-password" class="btn-toggle-pass" title="Mostrar/Ocultar senha" aria-label="Mostrar ou ocultar senha">
                            <i class="bi bi-eye-fill" id="icon-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-entrar" class="btn-submit">
                    <span>ENTRAR</span>
                    <i class="bi bi-box-arrow-in-right"></i>
                </button>
            </form>
        </div>
    </div>

    <footer class="login-footer">
        AcrillService &bull; 2026
    </footer>
</main>

<script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const iconMoon = document.getElementById('icon-moon');
    const iconSun = document.getElementById('icon-sun');

    function atualizarIconesTema(theme) {
        iconMoon.style.display = theme === 'dark' ? 'none' : 'block';
        iconSun.style.display = theme === 'dark' ? 'block' : 'none';
    }

    atualizarIconesTema(document.documentElement.getAttribute('data-theme'));

    themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        atualizarIconesTema(newTheme);
    });

    const togglePassBtn = document.getElementById('toggle-password');
    const passInput = document.getElementById('password');
    const iconEye = document.getElementById('icon-eye');

    togglePassBtn.addEventListener('click', () => {
        const isPassword = passInput.type === 'password';
        passInput.type = isPassword ? 'text' : 'password';
        iconEye.className = isPassword ? 'bi bi-eye-slash-fill' : 'bi bi-eye-fill';
    });
</script>

<script type="module" src="./assets/js/login/main.js"></script>
</body>
</html>
