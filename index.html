<!DOCTYPE html>
<html lang="pt-BR" data-role="Admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSADMIN - AcrillService</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/sysadmin.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="./assets/img/logo-acrillservice.png" alt="AcrillService" onerror="this.style.display='none'">
                <span class="logo-text">ACRILLSERVICE</span>
            </div>

            <nav class="sidebar-nav">
                <a href="http://localhost:8085/" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    <span>INÍCIO</span>
                </a>
                <a href="http://localhost:8085/produtos" class="nav-item">
                    <i class="fa-solid fa-box"></i>
                    <span>PRODUTOS</span>
                </a>
                <a href="http://localhost:8085/vendas" class="nav-item">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>VENDAS</span>
                </a>
                <a href="http://localhost:8085/orcamentos" class="nav-item">
                    <i class="fa-solid fa-file-lines"></i>
                    <span>ORÇAMENTOS</span>
                </a>
                <a href="http://localhost:8085/clientes" class="nav-item">
                    <i class="fa-solid fa-users"></i>
                    <span>CLIENTES</span>
                </a>
                <a href="http://localhost:8085/avaliacoes" class="nav-item">
                    <i class="fa-solid fa-star"></i>
                    <span>AVALIAÇÕES</span>
                </a>
                <a href="./index.html" class="nav-item active">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>SYSADMIN</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button type="button" id="btn-logout" class="nav-item logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>SAIR</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h1>SYSADMIN</h1>
            </header>

            <div class="alert" id="alert-card" style="display: none;">
                <span id="alert-text">Mensagem do sistema</span>
            </div>

            <section class="toolbar">
                <div class="toolbar-left">
                    <button type="button" id="btn-novo-usuario" class="btn-primary">
                        NOVO USUÁRIO
                    </button>
                </div>
            </section>

            <section class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>E-MAIL</th>
                            <th>PERMISSÕES (ROLES)</th>
                            <th>STATUS</th>
                            <th class="text-right">AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <div class="modal-overlay" id="modal-usuario" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modal-usuario-titulo">NOVO USUÁRIO</h2>
                <button type="button" class="btn-close-modal" data-close="modal-usuario">&times;</button>
            </div>
            <form id="form-usuario">
                <input type="hidden" id="usuario-id">

                <div class="form-group">
                    <label for="usuario-email">E-MAIL:</label>
                    <input type="email" id="usuario-email" placeholder="usuario@empresa.com" required>
                </div>

                <div class="form-group" id="grupo-senha">
                    <label for="usuario-senha">SENHA:</label>
                    <input type="password" id="usuario-senha" placeholder="Digite a senha inicial">
                    <small class="help-text" id="senha-help" style="display: none;">Deixe em branco para manter a senha atual.</small>
                </div>

                <div class="form-group">
                    <label>PERMISSÕES (ROLES):</label>
                    <div class="roles-list" id="roles-checkbox-container">
                        <label class="role-checkbox-item">
                            <input type="checkbox" name="roles" value="Admin">
                            <span><strong>Admin</strong> — Acesso total e gerenciamento de usuários</span>
                        </label>
                        <label class="role-checkbox-item">
                            <input type="checkbox" name="roles" value="sales">
                            <span><strong>sales</strong> — Vendas, orçamentos e clientes</span>
                        </label>
                        <label class="role-checkbox-item">
                            <input type="checkbox" name="roles" value="add_product">
                            <span><strong>add_product</strong> — Cadastro e edição de produtos</span>
                        </label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" data-close="modal-usuario">CANCELAR</button>
                    <button type="submit" class="btn-primary" id="btn-salvar-usuario">SALVAR</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="./assets/js/index/main.js"></script>
</body>
</html>
