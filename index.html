<!DOCTYPE html>
<html lang="pt-BR" data-role="Admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sysadmin - AcrillService</title>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/sysadmin.css">
</head>
<body>

<div class="app-container">
    <div class="alert" id="alert-card" style="display: none;" role="alert">
        <div class="alert-content">
            <i class="bi bi-exclamation-triangle-fill alert-icon" id="alert-icon"></i>
            <span id="alert-text">Mensagem do sistema</span>
        </div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-logo">
            <a href="http://localhost:8085/" class="logo-link">
                <img src="assets/images/acrillogo.svg" alt="Logo AcrillService"
                     onerror="this.onerror=null; this.src='./assets/img/logo-acrillservice.png';">
            </a>
        </div>

        <nav class="sidebar-nav">
            <a href="http://localhost:8085/" class="nav-item">
                <i class="bi bi-house-door-fill"></i>
                <span>INÍCIO</span>
            </a>
            <a href="http://localhost:8085/produto" class="nav-item">
                <i class="bi bi-box-seam-fill"></i>
                <span>PRODUTOS</span>
            </a>
            <a href="http://localhost:8085/venda" class="nav-item">
                <i class="bi bi-cart-fill"></i>
                <span>VENDAS</span>
            </a>
            <a href="http://localhost:8085/orcamento" class="nav-item">
                <i class="bi bi-file-earmark-text-fill"></i>
                <span>ORÇAMENTOS</span>
            </a>
            <a href="http://localhost:8085/cliente" class="nav-item">
                <i class="bi bi-people-fill"></i>
                <span>CLIENTES</span>
            </a>
            <a href="http://localhost:8085/avaliacao" class="nav-item">
                <i class="bi bi-star-fill"></i>
                <span>AVALIAÇÕES</span>
            </a>
            <a href="http://localhost:5500/report-service-interface/index.html" rel="noreferrer" class="nav-item">
                <i class="bi bi-bar-chart-line-fill"></i>
                <span>RELATÓRIOS</span>
            </a>
            <a href="./index.html" class="nav-item active">
                <i class="bi bi-shield-lock-fill"></i>
                <span>SYSADMIN</span>
            </a>
        </nav>

        <div class="user-profile-widget">
            <div class="user-info-row">
                <div class="user-avatar">
                    <span id="sidebar-user-avatar">A</span>
                </div>
                <div class="user-details">
                    <span class="user-email" id="sidebar-user-email" title="Carregando...">Carregando...</span>
                    <span class="user-role" id="sidebar-user-role">ADMIN</span>
                </div>
            </div>

            <div class="user-actions-row">
                <button type="button" id="theme-toggle" class="btn-theme" title="Alternar Tema" aria-label="Alternar Tema">
                    <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>

                <button type="button" id="btn-logout" class="btn-logout">SAIR</button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <h1 class="page-title">SYSADMIN</h1>
        </header>

        <section class="toolbar">
            <div class="toolbar-left">
                <button type="button" id="btn-novo-usuario" class="btn-orange">
                    NOVO USUÁRIO
                </button>
            </div>
        </section>

        <section class="table-container">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>E-mail</th>
                    <th>Permissões (Roles)</th>
                    <th>Status</th>
                    <th class="text-right">Ações</th>
                </tr>
                </thead>
                <tbody id="users-table-body">
                </tbody>
            </table>
        </section>
    </main>
</div>

<div class="modal-overlay" id="modal-usuario" style="display: none;">
    <div class="modal-card">
        <div class="modal-inner-border">
            <div class="modal-top-bar">
                <button type="button" class="btn-close-modal" data-close="modal-usuario" aria-label="Fechar">&times;</button>
            </div>

            <div class="modal-body-content">
                <h2 id="modal-usuario-titulo" class="modal-page-title">NOVO USUÁRIO</h2>
                <hr class="modal-divider">

                <form id="form-usuario" class="modal-form">
                    <input type="hidden" id="usuario-id">

                    <div class="form-group">
                        <label for="usuario-email">E-MAIL</label>
                        <input type="email" id="usuario-email" placeholder="usuario@empresa.com" required>
                    </div>

                    <div class="form-group" id="grupo-senha">
                        <label for="usuario-senha">SENHA</label>
                        <input type="password" id="usuario-senha" placeholder="Digite a senha inicial">
                        <small class="help-text" id="senha-help" style="display: none;">Deixe em branco para manter a senha atual.</small>
                    </div>

                    <div class="form-group">
                        <label>PERMISSÕES (ROLES)</label>
                        <div class="roles-list" id="roles-checkbox-container">
                            <label class="role-checkbox-item">
                                <input type="checkbox" name="roles" value="Admin">
                                <span><strong>Admin</strong> — Acesso total e gerenciamento de usuários</span>
                            </label>
                            <label class="role-checkbox-item">
                                <input type="checkbox" name="roles" value="sales">
                                <span><strong>sales</strong> — Vendas, orçamentos e clientes</span>
                            </label>
                            <label class="role-checkbox-item">
                                <input type="checkbox" name="roles" value="add_product">
                                <span><strong>add_product</strong> — Cadastro e edição de produtos</span>
                            </label>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn-outline-cancel" data-close="modal-usuario">CANCELAR</button>
                        <button type="submit" class="btn-orange btn-modal-save" id="btn-salvar-usuario">SALVAR</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="module" src="./assets/js/index/main.js"></script>
</body>
</html>
